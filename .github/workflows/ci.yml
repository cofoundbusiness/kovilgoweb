name: KovilGo CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Code Quality & Type Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint Verification
        run: npm run lint

      - name: Run TypeScript Strict Check
        run: npm run typecheck

      - name: Run Vitest Unit & Integration Suites
        run: npm run test

      - name: Verify Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: "https://kovilgo.com"
          NEXT_PUBLIC_SUPABASE_URL: "https://mock-ci-project.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-mock-key"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ci_db"
